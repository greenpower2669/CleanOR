name: CleanOR - tests hors ligne
on:
  push:
    branches: ["feature/**", "main"]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer les sources
        uses: actions/checkout@v4
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Tester le noyau sans dépendances
        run: node --test tests/test-core.cjs tests/test-autoload.cjs
